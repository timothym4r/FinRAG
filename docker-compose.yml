services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      FINRAG_CORS_ORIGINS: http://localhost:3000
      FINRAG_DATABASE_URL: sqlite:////app/data/finrag.db
      FINRAG_UPLOAD_DIR: /app/data/uploads
      FINRAG_QDRANT_LOCAL_PATH: /app/data/qdrant
    ports:
      - "8000:8000"
    volumes:
      - finrag_backend_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_BASE_URL: http://backend:8000
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  finrag_backend_data:

